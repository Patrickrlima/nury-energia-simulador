name = "nury-fatura-reader"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Modelo usado para ler a fatura (Gemini, gratuito — sem cartão de crédito).
[vars]
GEMINI_MODEL = "gemini-2.5-flash"

# Depois de "wrangler deploy" (ou publicar pelo dashboard), configure o
# segredo com:
#   npx wrangler secret put GEMINI_API_KEY
# Ou, pelo dashboard: Worker > Settings > Variables and Secrets > Add >
# marque como "Secret" (nunca digite a chave em texto puro em nenhum lugar
# além dessa tela).
#
# Opcional: restrinja o CORS ao domínio do site (evita que outros sites usem
# seu Worker de graça). Sem essa var, libera para qualquer origem.
# ALLOWED_ORIGIN = "https://patrickrlima.github.io"
